apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-a
  namespace: aceest
  labels: {app: aceest, strategy: ab, track: variant-a}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: aceest, strategy: ab, track: variant-a}
  template:
    metadata:
      labels: {app: aceest, strategy: ab, track: variant-a}
    spec:
      containers:
        - name: app
          image: 2025tm93238/aceest-fitness:v2.1.0
          imagePullPolicy: IfNotPresent
          # One gunicorn worker per pod: Kubernetes scales by adding pods, and the
          # VM is small. --access-logfile - makes every request visible in pod logs.
          command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "app:app"]
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: DEPLOYMENT_TRACK, value: variant-a}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: SECRET_KEY}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: ADMIN_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
