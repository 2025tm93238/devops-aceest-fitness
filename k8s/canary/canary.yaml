apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels: {app: aceest, strategy: canary, track: stable}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: aceest, strategy: canary, track: stable}
  template:
    metadata:
      labels: {app: aceest, strategy: canary, track: stable}
    spec:
      containers:
        - name: app
          image: 2025tm93238/aceest-fitness:v2.1.0
          imagePullPolicy: IfNotPresent
          # One gunicorn worker per pod: Kubernetes scales by adding pods, and the
          # VM is small. --access-logfile - makes every request visible in pod logs.
          command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "app:app"]
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: DEPLOYMENT_TRACK, value: stable}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: SECRET_KEY}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: ADMIN_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest, strategy: canary, track: canary}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: aceest, strategy: canary, track: canary}
  template:
    metadata:
      labels: {app: aceest, strategy: canary, track: canary}
    spec:
      containers:
        - name: app
          image: 2025tm93238/aceest-fitness:v3.0.0
          imagePullPolicy: IfNotPresent
          # One gunicorn worker per pod: Kubernetes scales by adding pods, and the
          # VM is small. --access-logfile - makes every request visible in pod logs.
          command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "app:app"]
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: DEPLOYMENT_TRACK, value: canary}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: SECRET_KEY}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aceest-secrets, key: ADMIN_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          emptyDir: {}
---
# Selects BOTH tracks: traffic splits by replica ratio (3 stable : 1 canary = ~25%).
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels: {app: aceest}
spec:
  type: NodePort
  selector: {app: aceest, strategy: canary}
  ports:
    - {name: http, port: 5000, targetPort: http, nodePort: 30082}
