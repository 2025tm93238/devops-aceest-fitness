# SonarQube analysis settings for ACEest Fitness & Gym (read by sonar-scanner).
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

# Application code is the source; tests are analysed as tests. The original
# Tkinter versions, infrastructure and generated reports are not analysed.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,versions/**,k8s/**,infra/**,reports/**,dist/**,.venv/**,**/__pycache__/**,.sonar/**,.scannerwork/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# sonar.working.directory is passed on the command line (Jenkinsfile): the scanner
# image ignores it here, and the quality-gate stage reads .scannerwork/report-task.txt.
